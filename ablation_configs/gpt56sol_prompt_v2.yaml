run_name: gpt56sol

# Same everything as the frozen gpt-oss extraction (prompt v2 byte-identical, n_shots 4, seed 123,
# same eval thresholds) — ONLY the model changes, so the extractor is the single variable in the
# gpt-oss vs gpt-5.6-sol comparison. Azure resource, same as the judge.
llm_params:
  model: azure/gpt-5.6-sol
  api_key: ${azure_key}
  api_base: https://karim-api-resource.openai.azure.com
  api_version: "2024-12-01-preview"
  max_tokens: 16000

harness_params:
  prompt_file: gpt56sol_prompt_v2.txt
  output_dir: gpt56sol_prompt_v2
  curated_data_path: curated_data_json_by_doi.json
  curated_data_markdown_dir: curated_data_markdown_by_doi
  n_shots: 4
  shot_selection: random
  seed: 123
  evaluation:
    tp_threshold: 0.3
    catalyst_threshold: 0.6
    numeric_tolerance: 0.2
