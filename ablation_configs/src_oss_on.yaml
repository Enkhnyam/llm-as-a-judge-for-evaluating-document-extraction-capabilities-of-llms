run_name: src_oss_on

# source-tracking study, ARM=ON (prompt asks for source_chunk_ids) -- oss.
# Same harness, prompt and seed as its counterpart -- only the source-tracking instruction differs.
llm_params:
  model: openai/gpt-oss-120b
  api_key: ${openai_key}
  api_base: https://chat.kiconnect.nrw/api/v1/
  temperature: 1
  max_tokens: 8192

harness_params:
  prompt_file: gpt56sol_prompt_v2.txt
  output_dir: src_oss_on
  curated_data_path: curated_data_json_by_doi.json
  curated_data_markdown_dir: curated_data_markdown_by_doi
  max_workers: 3            # papers fanned out concurrently (I/O-bound)
  n_shots: 4
  shot_selection: random
  seed: 123
  evaluation:
    tp_threshold: 0.3
    catalyst_threshold: 0.8
    numeric_tolerance: 0.2
