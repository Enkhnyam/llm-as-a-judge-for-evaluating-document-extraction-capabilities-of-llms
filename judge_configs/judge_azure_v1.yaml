run_name: judge_azure

# Azure OpenAI resource (supervisor's). Judge model differs from the extractor (gpt-oss)
# -> no self-preference. Deployed & litellm-verified: gpt-5.6-sol (reasoning), gpt-5.4-mini.
# gpt-5.5 is NOT deployed on this resource.
llm_params:
  model: azure/gpt-5.6-sol
  api_key: ${azure_key}
  api_base: https://karim-api-resource.openai.azure.com
  api_version: "2024-12-01-preview"
  max_tokens: 16000        # reasoning tokens + a full paper's batch of verdicts

harness_params:
  rubric_file: judge_rubric_v1.txt
  extraction_run: openai_oss_120b_prompt_v2/openai_oss_120b_n4_r1   # frozen Loop-A bundle
  curated_data_markdown_dir: curated_data_markdown_by_doi
  output_dir: judge_azure_v1
