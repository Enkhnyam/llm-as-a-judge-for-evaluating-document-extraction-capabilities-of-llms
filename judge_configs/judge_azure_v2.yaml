run_name: judge_azure

# Same judge model as v1 (gpt-5.6-sol on the supervisor's Azure resource); only the rubric
# changes: v2 excludes source_chunk_ids from correctness and makes the derivable-value rule
# explicit. See prompts/judge_rubric_v2.txt and FINDINGS.md section 5.
llm_params:
  model: azure/gpt-5.6-sol
  api_key: ${azure_key}
  api_base: https://karim-api-resource.openai.azure.com
  api_version: "2024-12-01-preview"
  max_tokens: 16000        # reasoning tokens + a full paper's batch of verdicts

harness_params:
  rubric_file: judge_rubric_v2.txt
  extraction_run: openai_oss_120b_prompt_v2/openai_oss_120b_n4_r1   # frozen Loop-A bundle
  curated_data_markdown_dir: curated_data_markdown_by_doi
  output_dir: judge_azure_v2
