run_name: judge_gpt55

# Premium second judge (reasoning). Quota: ~25 calls — ALWAYS run with --targets, never
# the whole split. Judge model differs from extractor (gpt-oss) → no self-preference.
llm_params:
  model: openai/gpt-5.5
  api_key: ${openai_key}
  api_base: https://chat.kiconnect.nrw/api/v1/
  max_tokens: 8000        # reasoning tokens + JSON; temperature is NOT settable on gpt-5.5

harness_params:
  rubric_file: judge_rubric_v1.txt
  extraction_run: openai_oss_120b_prompt_v2/openai_oss_120b_n4_r1   # frozen Loop-A bundle
  curated_data_markdown_dir: curated_data_markdown_by_doi
  output_dir: judge_gpt55_v1
